[package]
name = "daggerfall-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy application entry for daggerfall-bevy-native"

[features]
# M1: window+render are additive OPT-IN; the default stays
# headless F0 (CI without system libs intact). Window+render:
#   cargo run -p daggerfall-app --features window
default = []
# M14 (REQ-L99-046): real device playback. Additive OPT-IN so the default
# headless build/CI needs no audio system libraries; without it the runtime
# uses `audio::NullSink` and says so.
#   cargo run -p daggerfall-app --features audio,window
# M34/W34-3 (`PROBE-AUDIO-RT-001` block C): the same feature also switches on
# the `daggerfall-nervous::audio` device layer (positional + ambient + real
# `samples_played` counter). Same rodio resolution: 0 new packages.
audio = ["dep:rodio", "daggerfall-nervous/audio"]
window = [
    "bevy/bevy_window",
    "bevy/bevy_winit",
    "bevy/bevy_log",
    "bevy/multi_threaded",
    "bevy/x11",
    "bevy/zstd_rust",
    "bevy/tonemapping_luts",
    "bevy/smaa_luts",
    # M17: 2D presentation of the 1996 UI (nearest sprite + own text
    # rendered from .FNT). Additive: default headless stays untouched.
    "bevy/bevy_text",
    "bevy/bevy_sprite",
    # M18: the sprite RENDER pipeline lives in its own crate in
    # Bevy 0.20 (`bevy_sprite` only models the components). Without
    # this feature `Sprite`/`Camera2d` are simulated and NEVER drawn:
    # the M17 window opened with a BLACK client area (EmpiricalProof
    # finding).
    "bevy/bevy_sprite_render",
]

[dependencies]
# Bevy 0.20.0 = max_stable on crates.io (verified 2026-10-17); satisfies the
# ADR-GAME-004 posture (Bevy >= 0.19). default-features disabled so the F0
# scaffold compiles headless; renderer/window features are enabled by the
# feature `window` above (M1) — additive, 0 deletion of F0.
# I1 F1 (§7.3): the version lives in `[workspace.dependencies]` — one
# declaration for the whole graph. The feature list stays here (additive
# OPT-IN, `window` below), so the headless default is unchanged.
bevy = { workspace = true }

daggerfall-nervous = { path = "../nervous" }
daggerfall-heart = { path = "../heart" }
daggerfall-memory = { path = "../memory" }
daggerfall-behavior = { path = "../behavior" }
daggerfall-perception = { path = "../perception" }
daggerfall-skills = { path = "../skills" }
daggerfall-inventory = { path = "../inventory" }
# M24: enchantment/alchemy — MAGIC.DEF, budget and the 20
# classic recipes (spec M24 §1-§3, REQ-L99-057).
daggerfall-crafting = { path = "../crafting" }
daggerfall-antibodies = { path = "../antibodies" }
# M22: combat engine — rng/actor/engine (spec M22 §1-§4,
# REQ-L99-055). The pure formulas live in `behavior::combat`.
daggerfall-combat = { path = "../combat" }
# I1 F1: the public contract (GameCorePlugin + law prelude + schedule
# contract). The binary consumes ONLY the relocated law types
# (`interior_transit` re-exports `SceneTransition`); it does not compose the
# plugin, so M behaviour is byte-for-byte the same (plan §7.1).
daggerfall-game-core = { path = "../game-core" }
# M1: DAG app → bridge → parser (PRE-2 §8). The bridge converts
# ARCH3D.BSA records into Bevy geometry at runtime; 0 packaged assets.
daggerfall-parser-bevy-bridge = { path = "../parser-bevy-bridge" }
# M10: probe RMB-001 matches `bsa::Entry`/`maps`/`rmb` against the
# pure parsers directly (same types the bridge re-exports via path
# dep — 0 duplicated types, 0 packaged assets).
daggerfall-parser-rs = { path = "../daggerfall_parser_rs" }
# M21: SHA-256 for the spec §7 digests — census of the 13824 B
# block (PROBE-ITEM-001 block C) and loot digest (PROBE-LOOT-001
# block D). Local cargo cache only (0 network dependency).
sha2 = "0.10"
# M14 (REQ-L99-046): real playback device behind the `audio` feature.
# `default-features = false, features = ["wav"]` keeps the decoder surface to
# WAV (what the production path synthesizes) and avoids the MP3/FLAC/Vorbis
# decoders that the game never needs.
rodio = { version = "0.20", default-features = false, features = ["wav"], optional = true }
