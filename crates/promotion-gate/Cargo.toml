[package]
name = "daggerfall-promotion-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97.1"
description = "I1 F4-B promotion gate: plan 4.3 steps 1-7 (incl. preview composition and main baseline), typed causes, append-only promotion ledger."
publish = false

[[bin]]
name = "promotion-gate"
path = "src/main.rs"

# Fixture harness for step 6 only (not a product binary): it publishes the
# runtime socket a real preview would publish, so the gate can observe a
# composition without linking the game into itself.
[[bin]]
name = "f4b-preview-side"
path = "src/bin/f4b-preview-side.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
semver = "1"

# Harness-only (src/bin/f4b-preview-side.rs): the gate itself validates the
# runtime `status` as an external client over the socket, never through these
# types. Do not use them from the gate library.
daggerfall-content-api = { path = "../content-api" }
daggerfall-game-runtime-api = { path = "../game-runtime-api" }
