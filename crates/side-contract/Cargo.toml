[package]
name = "daggerfall-side-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97.1"
description = "I1 F6-B side contract: deterministic bundle generation from anchors and derived facts, plus verify/check/sync/diff for side projects (DESIGN-v1 §10)."
publish = false

[[bin]]
name = "side-contract"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
